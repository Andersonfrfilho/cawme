appId: com.andersonfilho.cawme
---
# upload-document-from-gallery.yaml — Test mode flow
#
# In development/E2E mode, this bypasses the native photo picker and directly
# uses a test image. The component detects __e2e__ global and sets a test file
# when pickImage() is called.
#
# ENV obrigatório:
#   DOCUMENT_TYPE_ID — id do chip de tipo (cpf | rg | cnh | passport)
#
# Pré-condição: tela "Verificação de Documento" já está visível.
# Pós-condição: arquivo de teste configrado e botão de envio visível.

# 1. Seleciona o tipo de documento pelo chip
- tapOn:
    id: "document-type-chip-${DOCUMENT_TYPE_ID}"

# 2. Toca na área de upload → abre Alert com opções (Câmera, Galeria, PDF, Cancelar)
- tapOn:
    id: "document-upload-area"

# 3. Toca em "Galeria de Fotos" no Alert
#    Em modo de teste (dev), pickImage() configura uma imagem de teste
#    diretamente, sem abrir a galeria nativa
- tapOn:
    text: ".*[Gg]aleria.*"

# 4. Em modo de teste, a imagem é configurada automaticamente
#    Aguarda o botão de envio ficar visível (indica que a imagem foi carregada)
- extendedWaitUntil:
    visible:
      id: "document-upload-submit-button"
    timeout: 5000

# 4. Envia o documento
- tapOn:
    id: "document-upload-submit-button"
