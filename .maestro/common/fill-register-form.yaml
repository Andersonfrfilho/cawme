appId: com.andersonfilho.cawme
---
# Preenche o formulário de cadastro com dados configuráveis via env.
# Variáveis: FIRST_NAME, LAST_NAME, EMAIL, PHONE, DOCUMENT_TYPE, DOCUMENT, PASSWORD
# DOCUMENT_TYPE: cpf | cnpj | rg | passport (lowercase)
#
# IMPORTANTE: eraseText antes de cada inputText limpa valores residuais do
# checkpoint de cadastro (auto-resume), pois clearState não limpa o MMKV.
#
# Campos com teclado numérico (phone-pad / number-pad) ficam atrás do teclado
# quando teclado está aberto — tapOn nesses campos acertaria uma tecla do teclado.
# Solução: usar pressKey: Enter para acionar onSubmitEditing → próximo campo via ref.
#
# hideKeyboard após pressKey: Enter no documento funciona para todos os tipos porque
# há mudança de tipo de teclado em todos os casos:
#   - CPF/CNPJ/RG: number-pad → default (campo senha)
#   - Passport: ascii-capable → default (campo senha)
#
# PROBLEMA: após hideKeyboard, a árvore de acessibilidade reporta coordenadas desatualizadas
# (a animação de fechamento do teclado ainda não atualizou as posições dos elementos).
# Ambos os toggles reportam a mesma coordenada Y, indicando cache stale.
# SOLUÇÃO: aguardar "Avançar" ficar visível — o botão só aparece na tela quando o teclado
# está completamente fechado e o layout foi atualizado, forçando re-sync da árvore.

# Seleciona o tipo de documento ANTES de tocar nos campos (sem teclado)
- tapOn:
    id: "register-docType-${DOCUMENT_TYPE}"

# Nome (text keyboard → hideKeyboard funciona)
- tapOn:
    id: "register-firstName"
- eraseText: 50
- inputText: "${FIRST_NAME}"
- hideKeyboard

# Sobrenome
- tapOn:
    id: "register-lastName"
- eraseText: 50
- inputText: "${LAST_NAME}"
- hideKeyboard

# E-mail
- tapOn:
    id: "register-email"
- eraseText: 100
- inputText: "${EMAIL}"
- hideKeyboard

# Telefone (phone-pad)
# pressKey: Enter → onSubmitEditing → documentRef.focus() (evita tapOn atrás do teclado)
- tapOn:
    id: "register-phone"
- eraseText: 20
- inputText: "${PHONE}"
- pressKey: Enter

# Número do documento (foco vem via onSubmitEditing do telefone)
# pressKey: Enter → onSubmitEditing → passwordRef.focus()
- eraseText: 20
- inputText: "${DOCUMENT}"
- pressKey: Enter
- hideKeyboard

# Aguarda o botão "Avançar" ficar visível: indica que o teclado está completamente fechado
# e a árvore de acessibilidade foi atualizada com as posições corretas dos elementos.
- extendedWaitUntil:
    visible: "Avançar"
    timeout: 5000

# iOS/XCUITest não digita em secureTextEntry=true; ativar os toggles com teclado fechado.
# Coordenadas corretas após a árvore de acessibilidade ser atualizada.
- tapOn:
    id: "register-password-toggle"
- tapOn:
    id: "register-passwordConfirmation-toggle"

# Senha (secureTextEntry=false após toggle)
- tapOn:
    id: "register-password"
- eraseText: 50
- inputText: "${PASSWORD}"
- pressKey: Enter

# Confirmação de senha (foco via onSubmitEditing; secureTextEntry=false após toggle acima)
- eraseText: 50
- inputText: "${PASSWORD}"
- pressKey: Enter
