appId: com.andersonfilho.cawme
---
# Preenche o formulário de cadastro com dados configuráveis via env.
# Variáveis: FIRST_NAME, LAST_NAME, EMAIL, PHONE, DOCUMENT_TYPE, DOCUMENT, PASSWORD
# DOCUMENT_TYPE: cpf | cnpj | rg | passport (lowercase)
#
# IMPORTANTE: eraseText antes de cada inputText limpa valores residuais do
# checkpoint de cadastro (auto-resume), pois clearState não limpa o MMKV.
#
# Cadeia de foco via onSubmitEditing (returnKeyType="next"):
#   firstName → lastName → email → phone (foco automático)
# pressKey: Return em cada campo de texto aciona onSubmitEditing → próximo campo.
# Isso elimina hideKeyboard (intermitente no iOS com custom inputs) para campos de texto.
#
# Campos numéricos (phone-pad / number-pad):
#   phone → pressKey: Enter → onSubmitEditing → documentRef.focus()
#   document → pressKey: Enter → onSubmitEditing → passwordRef.focus()
#
# hideKeyboard só é usado antes dos toggles de senha, onde o teclado ainda
# pode estar ativo após o Enter no documento.

# Seleciona o tipo de documento ANTES de tocar nos campos (sem teclado)
- tapOn:
    id: "register-docType-${DOCUMENT_TYPE}"

# Nome → pressKey: Return → lastNameRef.focus() via onSubmitEditing
- tapOn:
    id: "register-firstName"
- eraseText: 50
- inputText: "${FIRST_NAME}"
- pressKey: Enter

# Sobrenome (foco vem do onSubmitEditing do firstName)
- eraseText: 50
- inputText: "${LAST_NAME}"
- pressKey: Enter

# E-mail (foco vem do onSubmitEditing do lastName)
- eraseText: 100
- inputText: "${EMAIL}"
- pressKey: Enter

# Telefone (foco vem do onSubmitEditing do email → phoneRef.focus())
# pressKey: Enter → onSubmitEditing → documentRef.focus()
- eraseText: 20
- inputText: "${PHONE}"
- pressKey: Enter

# Número do documento (foco vem via onSubmitEditing do telefone)
# pressKey: Enter → onSubmitEditing → passwordRef.focus()
- eraseText: 20
- inputText: "${DOCUMENT}"
- pressKey: Enter
- hideKeyboard

# Aguarda "Confirmar senha" ficar visível — indica que o teclado fechou e o form rolou
# para a área de senha. Mais confiável do que "Avançar" pois não sai da tela quando
# há mensagens de erro inline (duplicatas) que empurram o botão para baixo do viewport.
- extendedWaitUntil:
    visible: "Confirmar senha"
    timeout: 8000

# iOS/XCUITest não digita em secureTextEntry=true; ativar os toggles com teclado fechado.
# Coordenadas corretas após a árvore de acessibilidade ser atualizada.
- tapOn:
    id: "register-password-toggle"
- tapOn:
    id: "register-passwordConfirmation-toggle"

# Senha (secureTextEntry=false após toggle)
- tapOn:
    id: "register-password"
- eraseText: 50
- inputText: "${PASSWORD}"
- pressKey: Enter

# Confirmação de senha (foco via onSubmitEditing; secureTextEntry=false após toggle acima)
- eraseText: 50
- inputText: "${PASSWORD}"
- pressKey: Enter
