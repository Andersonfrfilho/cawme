appId: com.andersonfilho.cawme
name: ❌ Verification Error - Código inválido
description: |
  Testa os erros da tela de verificação:
  1. Registra usuário único
  2. Passa pelos termos e endereço
  3. Chega na tela de verificação
  4. Insere código errado → mensagem de erro
  5. Troca de aba (telefone) e repete
  6. Pula verificação → home
tags:
  - verification
  - error
  - code
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='114'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Verify"
      LAST_NAME: "Error"
      EMAIL: "verifyerror${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Pode ir para endereço — preenche CEP e avança para verificação
- runFlow:
    when:
      visible: "Onde você mora?"
    commands:
      - tapOn:
          id: "address-cep-input"
      - inputText: "01310100"
      - extendedWaitUntil:
          visible: "Endereço encontrado"
          timeout: 15000
      - tapOn:
          id: "address-number-input"
      - inputText: "100"
      - pressKey: Enter
      - pressKey: Enter

- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 15000

# ── Teste 1: Código errado no email ──────────────────────────────────────────
# Toca no primeiro campo de código e digita código errado
- tapOn:
    id: "verification-code-0"
- inputText: "9"
- inputText: "9"
- inputText: "9"
- inputText: "9"

- tapOn:
    id: "verification-verify-button"

- extendedWaitUntil:
    visible: ".*inválido.*|.*incorreto.*|.*errado.*|.*tente.*"
    timeout: 6000

# ── Teste 2: Mesmo erro na aba de telefone ────────────────────────────────────
- tapOn:
    id: "verification-tab-phone"

- extendedWaitUntil:
    visible: ".*Código enviado.*|.*SMS.*|.*telefone.*"
    timeout: 8000

- tapOn:
    id: "verification-code-0"
- inputText: "9"
- inputText: "9"
- inputText: "9"
- inputText: "9"

- tapOn:
    id: "verification-verify-button"

- extendedWaitUntil:
    visible: ".*inválido.*|.*incorreto.*|.*errado.*|.*tente.*"
    timeout: 6000

# Pula verificação após testar erros
- tapOn:
    id: "verification-skip-button"

- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 8000
