appId: com.andersonfilho.cawme
name: ❌ Verification Error - Código inválido
description: |
  Testa os erros da tela de verificação:
  1. Insere código errado → mensagem de erro
  2. Verifica que o botão de reenviar aparece
  3. Testa reenvio de código
  4. Verifica que o timer de reenvio funciona
tags:
  - verification
  - error
  - code
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Verify"
      LAST_NAME: "Error"
      EMAIL: "verifyerror${output.TS}@test.com"
      PHONE: "11911110000"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# Chega na verificação (pode ter passado pelo endereço)
- runFlow:
    when:
      visible: ".*CEP.*|.*Endereço.*"
    commands:
      - tapOn:
          text: ".*Não sei.*|.*Buscar por nome.*"
          optional: true
      - tapOn:
    id: "register-submit"
        optional: true

- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 8000

# ── Teste 1: Código errado no email ──────────────────────────────────────────
- assertVisible: "E-mail"

# Insere código errado
- inputText: "9"
- inputText: "9"
- inputText: "9"
- inputText: "9"

- extendedWaitUntil:
    visible: ".*inválido.*|.*incorreto.*|.*errado.*|.*tente.*"
    timeout: 6000

- takeScreenshot: "verification-wrong-code-email.png"

# ── Teste 2: Botão de reenviar ────────────────────────────────────────────────
- runFlow:
    when:
      visible: ".*Reenviar.*|.*Reenvio.*|.*Enviar novamente.*"
    commands:
      - tapOn: ".*Reenviar.*|.*Enviar novamente.*"
      - extendedWaitUntil:
          visible: ".*enviado.*|.*reenviado.*|.*código.*novo.*"
          timeout: 5000

# ── Teste 3: Mesmo erro na aba de telefone ────────────────────────────────────
- tapOn: "Telefone"

- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"

- extendedWaitUntil:
    visible: ".*inválido.*|.*incorreto.*|.*errado.*|.*tente.*"
    timeout: 6000

- takeScreenshot: "verification-wrong-code-phone.png"

# Pula verificação após testar erros
- tapOn: "Verificar depois"

- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*"
    timeout: 8000
