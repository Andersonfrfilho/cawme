appId: com.andersonfilho.cawme
name: ✅ Register Full Flow - CEP + Verificação QA
description: |
  Fluxo completo de cadastro:
  1. Cadastro com CPF
  2. Endereço via busca de CEP
  3. Verificação de email com código QA (0000)
  4. Verificação de telefone com últimos 4 dígitos
  Nota: requer backend em modo QA (email=0000, phone=últimos 4 dígitos do número)
tags:
  - critical
  - register
  - full-flow
  - cep
  - verification
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# ── 1. Cadastro ───────────────────────────────────────────────────────────────
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Full"
      LAST_NAME: "FlowTest"
      EMAIL: "fullflow${output.TS}@test.com"
      PHONE: "11912345678"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# ── 2. Endereço via CEP ───────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*CEP.*|.*Endereço.*"
    timeout: 10000

# Digita o CEP
- tapOn:
    text: ".*CEP.*|.*Digite seu CEP.*"
    optional: true
- inputText: "01310100"

# Aguarda busca e confirma endereço encontrado
- extendedWaitUntil:
    visible: ".*Endereço encontrado.*|.*Confirm.*|.*Av.*|.*Rua.*"
    timeout: 8000

# Preenche número
- tapOn:
    text: ".*Número.*"
    optional: true
- inputText: "1000"

# Avança para verificação
- tapOn:
    id: "register-submit"

# ── 3. Verificação de email (código QA: 0000) ─────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 8000

- assertVisible: "E-mail"

# Insere código QA do email (0000)
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"

- runFlow:
    when:
      visible: ".*Verificado.*|.*verificado.*|.*E-mail verificado.*"
    commands:
      - assertVisible: ".*Verificado.*"

# ── 4. Verificação de telefone (código QA: últimos 4 dígitos = 5678) ──────────
- tapOn: "Telefone"

- extendedWaitUntil:
    visible: ".*Código enviado.*|.*telefone.*"
    timeout: 5000

# Código QA = últimos 4 dígitos do telefone 11912345678 = 5678
- inputText: "5"
- inputText: "6"
- inputText: "7"
- inputText: "8"

- runFlow:
    when:
      visible: ".*Verificado.*|.*Telefone verificado.*"
    commands:
      - assertVisible: ".*Verificado.*"

# Avança para home (ou documento)
- runFlow:
    file: ../common/skip-to-home.yaml
