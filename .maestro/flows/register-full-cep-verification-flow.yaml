appId: com.andersonfilho.cawme
name: ✅ Register Full Flow - CEP + Verificação QA
description: |
  Fluxo completo de cadastro (contractor):
  1. Cadastro com CPF único
  2. Endereço via CEP (01310100 = Av. Paulista, SP)
  3. Verificação de email com código QA (0000) ✅
  4. Verificação de telefone com últimos 4 dígitos do número ✅
  5. Auto-login → DocumentUploadSheet → "Fazer depois" → home com badge
  Códigos QA: email=0000 / telefone=últimos 4 dígitos do número
tags:
  - critical
  - register
  - full-flow
  - cep
  - verification
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='110'+output.TS; var ph=output.PHONE; output.PC0=ph[ph.length-4]; output.PC1=ph[ph.length-3]; output.PC2=ph[ph.length-2]; output.PC3=ph[ph.length-1];}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# ── 1. Cadastro ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Full"
      LAST_NAME: "FlowTest"
      EMAIL: "fullflow${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 15000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# ── 2. Endereço via CEP ───────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "01310100"

- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 15000

- tapOn:
    id: "address-number-input"
- inputText: "1000"
- pressKey: Enter
- pressKey: Enter

# ── 3. Verificação de e-mail (código QA: 0000) ────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

- tapOn:
    id: "verification-code-0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn:
    id: "verification-verify-button"

# ── 4. Verificação de telefone (código QA: últimos 4 dígitos do número) ───────
- extendedWaitUntil:
    visible: ".*Telefone.*|.*verification-tab-phone.*"
    timeout: 8000

- tapOn:
    id: "verification-tab-phone"

- extendedWaitUntil:
    visible: ".*Código enviado.*"
    timeout: 8000

- tapOn:
    id: "verification-code-0"
- inputText: "${output.PC0}"
- inputText: "${output.PC1}"
- inputText: "${output.PC2}"
- inputText: "${output.PC3}"
- tapOn:
    id: "verification-verify-button"

# ── 5. Ambos verificados → "Avançar" → auto-login → DocumentUploadSheet ───────
- extendedWaitUntil:
    visible: ".*Avançar.*|.*Verificar sua identidade.*|.*Enviar agora.*"
    timeout: 10000

# Caso esteja na tela com botão "Avançar" (ambos verificados)
- runFlow:
    when:
      visible: ".*Avançar.*"
    commands:
      - tapOn: "Avançar"

# DocumentUploadSheet aberto após auto-login — aguarda botões ficarem acessíveis
- extendedWaitUntil:
    visible:
      id: "document-sheet-later-button"
    timeout: 10000

# Contractor pode enviar depois — botão "Enviar agora" também presente
- assertVisible:
    id: "document-sheet-now-button"
- assertNotVisible: "Verificar depois"
- tapOn:
    id: "document-sheet-later-button"

# ── 6. Home com badge de documento pendente ───────────────────────────────────
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 12000

# Auto-login bem sucedido → isSignedIn=true → badge aparece com documento pendente
- assertVisible:
    id: "pending-verification-banner"
