appId: com.cawme.app
tags: [auth, password, error, e2e]

description: Forgot password error validation flow - tests local form validation

commands:
  # 1. Navigate to ForgotPasswordScreen
  - tapOn:
      text: Esqueci minha senha
  - delay: 500ms

  # 2. Verify email input is visible
  - assertVisible:
      id: forgot-password-email-input

  # 3. Try to submit with empty field - button should be disabled
  - assertDisabled:
      id: forgot-password-submit-button

  # 4. Type invalid email format (no @)
  - inputText:
      id: forgot-password-email-input
      text: invalido
  - delay: 300ms

  # 5. Verify button remains disabled due to validation error
  - assertDisabled:
      id: forgot-password-submit-button

  # 6. Verify error message is shown
  - assertVisible:
      text: Informe um e-mail válido

  # 7. Clear and type valid email format
  - clearTextInput:
      id: forgot-password-email-input
  - inputText:
      id: forgot-password-email-input
      text: valid@email.com
  - delay: 300ms

  # 8. Verify button becomes enabled
  - assertEnabled:
      id: forgot-password-submit-button
