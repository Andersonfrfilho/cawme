appId: com.andersonfilho.cawme
name: 🚫 Blocked Account Flow
description: |
  Testa tela de conta bloqueada:
  1. Registra usuário e chega na tela de verificação
  2. Pula verificação — o auto-login pode falhar com erro de conta
  3. Navega para a tela de bloqueio (se o servidor retornar status bloqueado)
  4. Verifica elementos UI da tela de bloqueio
  Nota: o bloqueio efetivo depende do estado do servidor para aquela conta.
  O teste valida que o app consegue navegar e exibir corretamente a tela.
tags:
  - blocked
  - error
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='108'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Blocked"
      LAST_NAME: "Account"
      EMAIL: "blocked${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Chega no endereço ou verificação
- runFlow:
    file: ../common/skip-to-home.yaml

# Se chegou na tela de conta bloqueada, verifica os elementos
- runFlow:
    when:
      visible: "Conta Temporariamente Bloqueada"
    commands:
      - assertVisible: "Falar com Suporte"
      - assertVisible: "Voltar para o Login"
      - tapOn: "Voltar para o Login"
      - extendedWaitUntil:
          visible: "Cawme"
          timeout: 8000

# Se chegou na home normalmente, o teste passou sem conta bloqueada
- runFlow:
    when:
      visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    commands:
      - assertVisible: ".*Início.*|.*Home.*|.*Dashboard.*"
