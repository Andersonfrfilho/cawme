appId: com.andersonfilho.cawme
name: ❌ Address Error - CEP não encontrado
description: |
  Testa o fluxo de erro quando o CEP não é encontrado:
  1. Chega na tela de endereço
  2. Digita CEP inválido/inexistente
  3. Verifica mensagem de erro "CEP não encontrado"
  4. Testa o caminho alternativo: "Não sei meu CEP" ou mapa
tags:
  - address
  - error
  - cep
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Cep"
      LAST_NAME: "Error"
      EMAIL: "ceperror${output.TS}@test.com"
      PHONE: "11922221111"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

- extendedWaitUntil:
    visible: ".*CEP.*|.*Endereço.*"
    timeout: 10000

# ── Teste 1: CEP inexistente (00000000) ───────────────────────────────────────
- tapOn:
    text: ".*CEP.*|.*Digite.*CEP.*"
    optional: true
- inputText: "00000000"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*não encontrado.*|.*CEP.*inválido.*|.*tente.*|.*não localizado.*"
    timeout: 8000

- takeScreenshot: "cep-not-found-error.png"

# ── Teste 2: CEP com formato errado (só 5 dígitos) ───────────────────────────
- clearText:
    optional: true
- inputText: "01310"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*inválido.*|.*completo.*|.*8 dígitos.*|.*formato.*"
    timeout: 5000

# ── Fallback: usa o botão "Não sei meu CEP" ──────────────────────────────────
- tapOn:
    text: ".*Não sei.*|.*Buscar por nome.*"

- extendedWaitUntil:
    visible: ".*Buscar.*|.*Digite.*rua.*|.*logradouro.*"
    timeout: 5000

- takeScreenshot: "cep-fallback-to-autocomplete.png"
