appId: com.andersonfilho.cawme
name: ❌ Address Error - CEP não encontrado
description: |
  Testa o fluxo de erro quando o CEP não é encontrado:
  1. Cadastra usuário e chega na tela de endereço
  2. Digita CEP inexistente (00000000) → erro "CEP não encontrado"
  3. Testa o caminho alternativo: "Não sei meu CEP"
tags:
  - address
  - error
  - cep
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='113'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Cep"
      LAST_NAME: "Error"
      EMAIL: "ceperror${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Aguarda chegar na tela de endereço
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

# ── Teste 1: CEP inexistente (00000000) ───────────────────────────────────────
# O campo CEP tem autoFocus — digitar diretamente
- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "00000000"

# Aguarda resposta do ViaCEP (erro — CEP não encontrado)
- extendedWaitUntil:
    visible: ".*não encontrado.*|.*CEP.*inválido.*|.*tente.*|.*não localizado.*"
    timeout: 10000

# ── Teste 2: Navega para busca por nome de rua ────────────────────────────────
# Scroll down para garantir que o botão está visível (erro pode empurrar conteúdo)
- scroll
- tapOn:
    text: ".*sei meu CEP.*"

- extendedWaitUntil:
    visible: ".*Buscar.*|.*Digite.*|.*rua.*|.*logradouro.*"
    timeout: 5000
