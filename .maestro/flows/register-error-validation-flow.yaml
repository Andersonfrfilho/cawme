appId: com.andersonfilho.cawme
name: ❌ Register Error - Validação de Campos
description: |
  Testa todos os erros de validação do formulário de cadastro:
  1. Envio com campos vazios → erros "obrigatório"
  2. Email inválido (sem @)
  3. Senha curta (< 8 chars)
  4. Senhas diferentes
  5. CPF inválido (sequência)
  6. CPF com dígitos incorretos
tags:
  - register
  - error
  - validation
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# ── Teste 1: Submit vazio → erros de campo obrigatório ────────────────────────
- tapOn: "CPF"
- tapOn:
    id: "register-submit"

# Deve mostrar erros de campo obrigatório
- extendedWaitUntil:
    visible: ".*obrigatório.*|.*campo.*|.*mínimo.*|.*preencha.*"
    timeout: 5000

# ── Teste 2: Email inválido ───────────────────────────────────────────────────
- inputText: "João"
- inputText: "Teste"
- inputText: "emailinvalido"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*e-mail.*inválido.*|.*email.*inválido.*|.*formato.*"
    timeout: 5000

# Limpa o campo de email e coloca email válido para próximo teste
- clearText:
    optional: true
- inputText: "joao${output.TS}@test.com"

# ── Teste 3: Telefone inválido (curto) ────────────────────────────────────────
- inputText: "9999"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*telefone.*|.*celular.*|.*mínimo.*"
    timeout: 5000

# Preenche telefone válido
- clearText:
    optional: true
- inputText: "11944443333"

# ── Teste 4: CPF inválido (sequência 111...1) ─────────────────────────────────
- inputText: "11111111111"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*CPF.*inválido.*|.*documento.*inválido.*"
    timeout: 5000

# Corrige CPF
- clearText:
    optional: true
- inputText: "12345678909"

# ── Teste 5: Senha curta ──────────────────────────────────────────────────────
- inputText: "123"
- inputText: "123"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*senha.*mínimo.*|.*senha.*curta.*|.*caracteres.*"
    timeout: 5000

# ── Teste 6: Senhas diferentes ────────────────────────────────────────────────
- clearText:
    optional: true
- inputText: "Senha@123"
- clearText:
    optional: true
- inputText: "SenhaDiferente@456"

- tapOn:
    id: "register-submit"

- extendedWaitUntil:
    visible: ".*senhas.*|.*confirmação.*|.*coincidir.*|.*iguais.*"
    timeout: 5000

# Tira screenshot do estado de erro
- takeScreenshot: "register-validation-errors.png"
