appId: com.andersonfilho.cawme
name: ❌ Register Error - Validação de Campos
description: |
  Testa erros de validação client-side via onChange:
  1. Preenche form quase completo com senhas diferentes
  2. "As senhas não conferem" aparece no campo de confirmação
  O botão "Avançar" fica disabled enquanto o form é inválido (sem submit).
tags:
  - register
  - error
  - validation
  - e2e
---
- evalScript: ${output.TS=Date.now().toString().slice(-8); output.PHONE='119'+output.TS; var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join('');}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Preenche todos os campos com dados válidos
- tapOn:
    id: "register-docType-cpf"
- tapOn:
    id: "register-firstName"
- eraseText: 50
- inputText: "Teste"
- hideKeyboard

- tapOn:
    id: "register-lastName"
- eraseText: 50
- inputText: "Validacao"
- hideKeyboard

- tapOn:
    id: "register-email"
- eraseText: 100
- inputText: "valid${output.TS}@test.com"
- hideKeyboard

- tapOn:
    id: "register-phone"
- eraseText: 20
- inputText: "${output.PHONE}"
- pressKey: Enter

# CPF gerado dinamicamente (válido, único)
- eraseText: 20
- inputText: "${output.CPF}"
- pressKey: Enter
- hideKeyboard

# Ativa toggles de senha (teclado fechado, form estável)
- tapOn:
    id: "register-password-toggle"
- tapOn:
    id: "register-passwordConfirmation-toggle"

# Senha válida
- tapOn:
    id: "register-password"
- eraseText: 50
- inputText: "Senha@123"
- pressKey: Enter

# Confirmação DIFERENTE → refine Zod falha → onChange → "As senhas não conferem"
- eraseText: 50
- inputText: "SenhaErrada9"
- hideKeyboard

# Erro de mismatch deve aparecer abaixo do campo de confirmação
- extendedWaitUntil:
    visible: ".*não conferem.*|.*senhas.*|.*coincidir.*|.*iguais.*"
    timeout: 8000
