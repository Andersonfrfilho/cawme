appId: com.andersonfilho.cawme
name: 📱 Profile Edit - Trocar Telefone (OTP = últimos 4 dígitos)
description: |
  Fluxo de troca de telefone com verificação OTP:
  1. Cadastra contractor único + endereço + verificação completa
  2. Chega na home autenticado
  3. Toca no ícone de perfil no header
  4. Tela "Editar perfil" aparece — telefone atual visível
  5. Toca no campo telefone → tela "Alterar telefone"
  6. Digita novo telefone
  7. Toca "Enviar código"
  8. Digita código QA: últimos 6 dígitos do novo número
  9. Toca "Confirmar"
  10. Alerta de sucesso → volta para edição de perfil
  Código QA para telefone: últimos 6 dígitos do novo número
tags:
  - account
  - profile-edit
  - phone-change
  - otp
  - e2e
---
# Gera dados de cadastro E dados do novo telefone
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='193'+output.TS; var ph=output.PHONE; output.PC0=ph[ph.length-4]; output.PC1=ph[ph.length-3]; output.PC2=ph[ph.length-2]; output.PC3=ph[ph.length-1]; output.NEWPHONE='194'+output.TS; var np=output.NEWPHONE; output.NEWPHONE_OTP=np.slice(-6);}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# ── 1. Cadastro (contractor) ──────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "EditPhone"
      LAST_NAME: "Teste"
      EMAIL: "editphone${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 15000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# ── 2. Endereço ───────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "01310100"

- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 15000

- tapOn:
    id: "address-number-input"
- inputText: "100"
- pressKey: Enter
- pressKey: Enter

# ── 3. Verificação e-mail (QA: 0000) ─────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

- tapOn:
    id: "verification-code-0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn:
    id: "verification-verify-button"

# ── 4. Verificação telefone original (QA: últimos 4 dígitos de PHONE) ─────────
- extendedWaitUntil:
    visible: ".*Telefone.*"
    timeout: 8000

- tapOn:
    id: "verification-tab-phone"

- extendedWaitUntil:
    visible: ".*Código enviado.*"
    timeout: 8000

- tapOn:
    id: "verification-code-0"
- inputText: "${output.PC0}"
- inputText: "${output.PC1}"
- inputText: "${output.PC2}"
- inputText: "${output.PC3}"
- tapOn:
    id: "verification-verify-button"

# ── 5. Avançar → auto-login → home ────────────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "verification-advance-button"
    timeout: 8000

- tapOn:
    id: "verification-advance-button"

# Pula DocumentUploadSheet se aparecer
- runFlow:
    when:
      visible:
        id: "document-sheet-now-button"
    commands:
      - tapOn:
          id: "document-sheet-later-button"

- extendedWaitUntil:
    visible: ".*Início.*"
    timeout: 20000

# ── 6. Abre tela de edição de perfil ─────────────────────────────────────────
- tapOn:
    id: "edit-profile-button"

- extendedWaitUntil:
    visible: "Editar perfil"
    timeout: 8000

# Telefone atual deve estar visível
- assertVisible:
    id: "change-phone-button"

# ── 7. Inicia troca de telefone ───────────────────────────────────────────────
- tapOn:
    id: "change-phone-button"

- extendedWaitUntil:
    visible: "Alterar telefone"
    timeout: 8000

# ── 8. Digita novo telefone ───────────────────────────────────────────────────
- tapOn:
    id: "contact-input"
- eraseText: 50
- inputText: "${output.NEWPHONE}"
- pressKey: Enter

# ── 9. Envia código ───────────────────────────────────────────────────────────
- tapOn:
    id: "send-code-button"

- extendedWaitUntil:
    visible:
      id: "otp-input"
    timeout: 12000

# ── 10. Digita código QA: últimos 6 dígitos do NOVO telefone ─────────────────
- tapOn:
    id: "otp-input"
- inputText: "${output.NEWPHONE_OTP}"

# ── 11. Confirma ─────────────────────────────────────────────────────────────
- tapOn:
    id: "confirm-button"

- extendedWaitUntil:
    visible: ".*sucesso.*|.*atualizado.*|.*trocado.*"
    timeout: 12000
