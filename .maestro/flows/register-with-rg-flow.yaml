appId: com.andersonfilho.cawme
name: ✅ Register Flow - RG
description: Cadastro completo com documento RG
tags:
  - register
  - rg
  - document-type
  - e2e
---
# Gera RG e telefone únicos por execução (RG é 9 dígitos baseado em timestamp)
- evalScript: ${output.TS=Date.now().toString().slice(-8); output.PHONE='119'+output.TS; output.RG='1'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "rg"
      FIRST_NAME: "Carlos"
      LAST_NAME: "Teste"
      EMAIL: "rg${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.RG}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- extendedWaitUntil:
    visible: ".*Endereço.*|.*Verificação.*|.*CEP.*"
    timeout: 12000

- runFlow:
    file: ../common/skip-to-home.yaml
