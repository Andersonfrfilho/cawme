appId: com.andersonfilho.cawme
name: 🔒 Regression - Sem erro de envio na chegada da tela de verificação
description: |
  Regressão: verifica que a mensagem "Não foi possível enviar o código." NÃO aparece
  ao entrar na tela de verificação após um cadastro bem-sucedido.

  Histórico: a mudança de sendVerificationCode para retornar SendCodeResult causou
  um bug onde API no formato antigo (sem expiresIn) provocava TypeError internamente,
  capturado pelo catch da tela e exibido como "Não foi possível enviar o código.",
  mesmo sem falha real na API.

  Critério de sucesso: a mensagem de erro (id: verification-error-message) é invisível
  imediatamente após a tela de verificação aparecer.
tags:
  - regression
  - verification
  - send-error
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='125'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "NoError"
      LAST_NAME: "Regression"
      EMAIL: "nosenderror${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- runFlow:
    when:
      visible: "Onde você mora?"
    commands:
      - tapOn:
          id: "address-cep-input"
      - inputText: "01310100"
      - extendedWaitUntil:
          visible: "Endereço encontrado"
          timeout: 15000
      - tapOn:
          id: "address-number-input"
      - inputText: "100"
      - pressKey: Enter
      - pressKey: Enter

# ── Critério principal da regressão ──────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

# Aguarda o sendInitialCode terminar (sucesso ou erro aparecem em ~1-2s)
- waitForAnimationToEnd

# Mensagem de erro NÃO deve estar visível — se estiver, o sendCode falhou internamente
- assertNotVisible:
    id: "verification-error-message"

# A tela deve estar pronta: campo de código e botão visíveis
- assertVisible:
    id: "verification-code-0"
- assertVisible:
    id: "verification-verify-button"

# Pula verificação → auto-login → home com badge pendente
- tapOn:
    id: "verification-skip-button"

- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 8000

# Banner de onboarding DEVE aparecer: handleSkipVerification salva pendingOnboarding → home renderiza sem precisar de login
- extendedWaitUntil:
    visible:
      id: "pending-onboarding-banner"
    timeout: 8000
