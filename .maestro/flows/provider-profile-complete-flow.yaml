appId: com.andersonfilho.cawme
name: 🎯 Provider Profile Setup - Complete Flow
description: |
  Complete end-to-end provider profile setup flow.
  Creates a new provider user from scratch and tests:
  1. Registration (email, phone, document, password)
  2. Email verification (QA mode: 0000)
  3. Phone verification (QA mode: last 4 digits)
  4. Document upload
  5. Provider Profile Setup:
     - Select 2 service categories
     - Add 2 services with pricing
     - Set availability for 3 days
     - Review and submit
  6. Verify successful completion (redirect to home)

tags:
  - provider
  - profile
  - registration
  - e2e
  - complete
---
# Generate random but valid CPF and phone
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='117'+output.TS; var ph=output.PHONE; output.PC0=ph[ph.length-4]; output.PC1=ph[ph.length-3]; output.PC2=ph[ph.length-2]; output.PC3=ph[ph.length-1];}

# Start fresh
- launchApp:
    clearState: true

# Wait for app to load
- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

# Logout if needed (cleanup from previous tests)
- runFlow:
    file: ../common/logout-if-needed.yaml

# ── Welcome Screen: Select Provider Path ────────────────────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-offer-button"

# ── Registration Form ───────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Use provider-specific registration flow (handles password field correctly)
- runFlow:
    file: ../common/fill-register-form-provider.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Provider"
      LAST_NAME: "Complete"
      EMAIL: "provider-complete-${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

# ── Terms Screen ────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 15000

# Close any debug warning overlay by tapping outside it
- tapOn:
    text: "Termos de Uso"

- tapOn:
    id: "terms-accept-checkbox"

# Close any overlay again before submitting
- tapOn:
    text: "Termos de Uso"

- tapOn:
    id: "terms-submit-button"

# ── Address Screen ──────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "01310100"

- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 15000

- tapOn:
    id: "address-number-input"
- inputText: "100"
- pressKey: Enter
- pressKey: Enter

# ── Email Verification ──────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

# QA Mode: Enter 0000 for email verification
- tapOn:
    id: "verification-code-0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"

- tapOn:
    id: "verification-verify-button"

# ── Phone Verification ──────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Telefone.*|.*verification-tab-phone.*"
    timeout: 8000

- tapOn:
    id: "verification-tab-phone"

- extendedWaitUntil:
    visible: ".*Código enviado.*"
    timeout: 5000

# Use last 4 digits of phone number
- tapOn:
    id: "verification-code-0"
- inputText: "${output.PC0}"
- inputText: "${output.PC1}"
- inputText: "${output.PC2}"
- inputText: "${output.PC3}"

- tapOn:
    id: "verification-verify-button"

# ── Advance from Verification ──────────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "verification-advance-button"
    commands:
      - tapOn:
          id: "verification-advance-button"

# ── Document Upload Sheet ──────────────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "document-sheet-now-button"
    commands:
      - tapOn:
          id: "document-sheet-now-button"

# ── Document Upload ────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Verificação de Documento"
    timeout: 15000

- runFlow:
    file: ../common/upload-document-from-gallery.yaml
    env:
      DOCUMENT_TYPE_ID: "cpf"

# ── Provider Profile Setup: Categories ──────────────────────────────────────
- extendedWaitUntil:
    visible: "Quais serviços você oferece?"
    timeout: 30000

# Select 2 categories
- tapOn:
    id: "category-card"
    index: 0

- tapOn:
    id: "category-card"
    index: 1

# Verify checkmarks appear (testID on the checkmark view)
- assertVisible:
    id: "category-checkmark"

# Proceed to services
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Services ────────────────────────────────────────
- extendedWaitUntil:
    visible: "Seus serviços"
    timeout: 8000

# Add first service
- tapOn:
    id: "add-service-button"

- extendedWaitUntil:
    visible: "Adicionar novo serviço"
    timeout: 5000

- tapOn:
    id: "service-name-input"
- inputText: "Limpeza Completa"

- tapOn:
    id: "price-input"
- inputText: "150"

- tapOn:
    id: "service-modal-submit-button"

# Verify service appears
- assertVisible: "Limpeza Completa"

# Add second service
- tapOn:
    id: "add-service-button"

- extendedWaitUntil:
    visible: "Adicionar novo serviço"
    timeout: 5000

- tapOn:
    id: "service-name-input"
- inputText: "Limpeza Rápida"

- tapOn:
    id: "price-input"
- inputText: "75"

- tapOn:
    id: "service-modal-submit-button"

# Verify second service
- assertVisible: "Limpeza Rápida"

# Proceed to availability
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Availability ────────────────────────────────────
- extendedWaitUntil:
    visible: "Sua disponibilidade"
    timeout: 8000

# Enable Monday (index 1) — keeps default 09:00-17:00 times
- tapOn:
    id: "day-toggle-1"

# Enable Tuesday (index 2) — keeps default 09:00-17:00 times
- tapOn:
    id: "day-toggle-2"

# Proceed to review — no time input means keyboard stays closed and button is accessible
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Review ──────────────────────────────────────────
- extendedWaitUntil:
    visible: "Confirmação do perfil"
    timeout: 8000

# Verify all sections are visible
- assertVisible: "Categorias"
- assertVisible: "Serviços"
- assertVisible: "Disponibilidade"

# Verify services appear
- assertVisible: "Limpeza Completa"
- assertVisible: "Limpeza Rápida"

# Verify days appear
- assertVisible: "Segunda"
- assertVisible: "Terça"

# Submit profile
- tapOn:
    id: "action-bar-submit-button"

# ── Verify Completion ───────────────────────────────────────────────────────
# Should redirect to home/dashboard
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 15000

# Final verification that we're on home screen
- assertVisible: ".*Início.*|.*Home.*|.*Dashboard.*"

# ── Log session data for manual replay ─────────────────────────────────────
- evalScript: |
    var email = 'provider-complete-' + output.TS + '@test.com';
    var phone = output.PHONE;
    var cpf = output.CPF;

    var sessionData = {
      timestamp: new Date().toISOString(),
      credentials: {
        email: email,
        phone: phone,
        cpf: cpf,
        password: 'Senha@123',
        documentType: 'cpf'
      },
      address: {
        cep: '01310100',
        number: '100'
      },
      verificationCodes: {
        email: '0000',
        phone: phone.slice(-4) + ' (últimos 4 dígitos do telefone)'
      },
      categories: ['Limpeza', 'Encanamento'],
      services: [
        { name: 'Limpeza Completa', price: 150, durationMinutes: 60 },
        { name: 'Limpeza Rápida', price: 75, durationMinutes: 60 }
      ],
      availability: [
        { day: 'Segunda (dayOfWeek=1)', hours: '09:00-17:00' },
        { day: 'Terça (dayOfWeek=2)', hours: '09:00-17:00' }
      ]
    };

    var json = JSON.stringify(sessionData, null, 2);

    var steps = [
      '# Cawme — Reprodução Manual do Fluxo Provider',
      '## Gerado em: ' + sessionData.timestamp,
      '',
      '## 1. Cadastro',
      '- Abra o app e toque em "Encontre profissionais" (caminho provider)',
      '- Preencha o formulário:',
      '  - Nome: Provider Complete',
      '  - Email: ' + email,
      '  - Telefone: ' + phone,
      '  - Documento (CPF): ' + cpf,
      '  - Senha: Senha@123',
      '',
      '## 2. Termos de Uso',
      '- Aceite os termos e avance',
      '',
      '## 3. Endereço',
      '- CEP: 01310100',
      '- Número: 100',
      '',
      '## 4. Verificação de Email',
      '- Código QA: 0000',
      '',
      '## 5. Verificação de Telefone',
      '- Aba "Telefone"',
      '- Código: ' + phone.slice(-4) + ' (últimos 4 dígitos)',
      '',
      '## 6. Upload de Documento',
      '- Toque em "Agora" no sheet',
      '- Selecione CPF como tipo de documento',
      '- Escolha qualquer imagem da galeria',
      '- Toque em Enviar',
      '',
      '## 7. Categorias',
      '- Selecione Limpeza e Encanamento',
      '- Avance',
      '',
      '## 8. Serviços',
      '- Adicione: Limpeza Completa — R$150 — 60min',
      '- Adicione: Limpeza Rápida — R$75 — 60min',
      '- Avance',
      '',
      '## 9. Disponibilidade',
      '- Ative Segunda e Terça (horários padrão 09:00-17:00)',
      '- Avance',
      '',
      '## 10. Revisão',
      '- Confirme as seções: Categorias, Serviços, Disponibilidade',
      '- Toque em Concluir',
      '',
      '## Resultado esperado',
      '- Redirecionamento para a tela Home (Início)',
    ].join('\n');

    var out = java.lang.System.out;
    out.println('');
    out.println('╔══════════════════════════════════════════════════╗');
    out.println('║         CAWME — DADOS DA SESSÃO DE TESTE         ║');
    out.println('╠══════════════════════════════════════════════════╣');
    out.println('║  Email   : ' + email);
    out.println('║  Telefone: ' + phone);
    out.println('║  CPF     : ' + cpf);
    out.println('║  Senha   : Senha@123');
    out.println('║  Cód.email: 0000');
    out.println('║  Cód.fone : ' + phone.slice(-4) + ' (últimos 4 dígitos)');
    out.println('╚══════════════════════════════════════════════════╝');
    out.println('');

    try {
      var FileWriter = java.io.FileWriter;

      var jsonWriter = new FileWriter('/tmp/cawme-test-session.json');
      jsonWriter.write(json);
      jsonWriter.close();

      var mdWriter = new FileWriter('/tmp/cawme-test-session.md');
      mdWriter.write(steps);
      mdWriter.close();

      out.println('📄 Sessão salva em /tmp/cawme-test-session.md');
      out.println('');

      output.SESSION_FILE = '/tmp/cawme-test-session.json';
      output.STEPS_FILE = '/tmp/cawme-test-session.md';
    } catch (e) {
      output.SESSION_LOG_ERROR = e.toString();
      out.println('⚠️  Falha ao salvar session: ' + e.toString());
    }
