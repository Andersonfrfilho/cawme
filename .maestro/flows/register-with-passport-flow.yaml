appId: com.andersonfilho.cawme
name: ✅ Register Flow - Passaporte
description: Cadastro completo com Passaporte (fluxo de estrangeiro)
tags:
  - register
  - passport
  - document-type
  - e2e
---
# Gera passaporte e telefone únicos por execução.
# Passaporte: "AB" + 6 dígitos aleatórios (formato padrão de passaporte brasileiro: 2 letras + 6 dígitos).
# Phone usa timestamp para unicidade; passaporte usa random para evitar colisão com runs anteriores.
- evalScript: ${output.TS=Date.now().toString().slice(-8); output.PHONE='119'+output.TS; output.PASSPORT='AB'+(Math.floor(Math.random()*900000)+100000).toString();}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "passport"
      FIRST_NAME: "John"
      LAST_NAME: "Smith"
      EMAIL: "passport${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.PASSPORT}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- extendedWaitUntil:
    visible: ".*Endereço.*|.*Verificação.*|.*CEP.*"
    timeout: 12000

- runFlow:
    file: ../common/skip-to-home.yaml
