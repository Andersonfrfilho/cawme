appId: com.andersonfilho.cawme
name: ✅ Verification Flow - Post Register
description: |
  Testa fluxo de verificação de email/telefone após cadastro:
  1. Cadastra usuário único
  2. Passa pelos termos
  3. Pula endereço (via skip-to-home não — vai diretamente para verificação)
  4. Verifica que a tela de verificação aparece com abas E-mail e Telefone
  5. Pula verificação e chega na home
tags:
  - verification
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='115'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Verify"
      LAST_NAME: "Test"
      EMAIL: "verify${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Pode ir para endereço primeiro ou direto para verificação
- runFlow:
    file: ../common/skip-to-home.yaml

# Verifica que chegou na home
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 8000

# Badge NÃO deve aparecer: skip-to-home usa handleSkipVerification → isSignedIn=false
# Usuário chega como convidado — design correto (Keycloak exige verificação para login)
- assertNotVisible:
    id: "pending-verification-banner"
- assertNotVisible: "Verificação Pendente"
