appId: com.andersonfilho.cawme
name: ✅ Verification Flow - Post Register
description: Testa fluxo de verificação de email/telefone após cadastro
tags:
  - verification
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Verify"
      LAST_NAME: "Test"
      EMAIL: "verify${output.TS}@test.com"
      PHONE: "11977776666"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

# Aceita termos
- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# Pula endereço se aparecer
- runFlow:
    when:
      visible: ".*CEP.*|.*Endereço.*"
    commands:
      - tapOn:
    id: "register-submit"
        optional: true

# Tela de verificação
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 8000

- assertVisible: "E-mail"

# Código enviado
- assertVisible: "Código enviado para"

# Verifica aba de telefone
- tapOn: "Telefone"

- extendedWaitUntil:
    visible: "Código enviado para"
    timeout: 5000

# Pular verificação
- tapOn: "Verificar depois"

# Verifica se home carregou
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*"
    timeout: 8000
