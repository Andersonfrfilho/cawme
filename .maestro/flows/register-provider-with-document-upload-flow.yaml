appId: com.andersonfilho.cawme
name: 📄 Provider - Registro Completo com Upload de Documento Obrigatório
description: |
  Fluxo completo de cadastro de provider (prestador) com upload obrigatório:
  1. Cadastra usuário único como provider (welcome-offer-button)
  2. Preenche endereço via CEP
  3. Verificação de e-mail (código QA: 0000)
  4. Assertiva: skip ausente + aviso obrigatório presente
  5. Verificação de telefone (código QA: últimos 4 dígitos)
  6. Avança → auto-login → DocumentUploadSheet (sem "Enviar depois")
  7. Assertiva: botão "Enviar depois" AUSENTE na sheet (provider obrigado)
  8. Toca "Enviar agora" → tela de upload (sem botão de skip)
  9. Assertiva: "document-upload-skip-button" AUSENTE
 10. Seleciona tipo CPF, escolhe imagem da galeria, envia documento
 11. Navega para home
  Garantia: provider NÃO consegue avançar sem concluir verificações nem upload.
tags:
  - provider
  - document
  - upload
  - mandatory
  - full-flow
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='131'+output.TS; var ph=output.PHONE; output.PC0=ph[ph.length-4]; output.PC1=ph[ph.length-3]; output.PC2=ph[ph.length-2]; output.PC3=ph[ph.length-1];}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# ── 1. Cadastro como provider (Quero oferecer serviços) ───────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-offer-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Provider"
      LAST_NAME: "DocUpload"
      EMAIL: "prvdoc${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

# ── 2. Termos ─────────────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 15000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# ── 3. Endereço via CEP ───────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "01310100"

- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 15000

- tapOn:
    id: "address-number-input"
- inputText: "100"
- pressKey: Enter
- pressKey: Enter

# ── 4. Verificação de e-mail (código QA: 0000) ────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

# Provider NÃO tem skip — assertiva incondicional
- assertNotVisible: "Verificar depois"
- assertVisible:
    id: "verification-provider-mandatory"

- tapOn:
    id: "verification-code-0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- inputText: "0"
- tapOn:
    id: "verification-verify-button"

# ── 5. Verificação de telefone (código QA: últimos 4 dígitos) ─────────────────
- extendedWaitUntil:
    visible: ".*Telefone.*|.*verification-tab-phone.*"
    timeout: 8000

- tapOn:
    id: "verification-tab-phone"

- extendedWaitUntil:
    visible: ".*Código enviado.*"
    timeout: 8000

# Skip ainda ausente após mudar de aba — assertiva persistente
- assertNotVisible: "Verificar depois"
- assertVisible:
    id: "verification-provider-mandatory"

- tapOn:
    id: "verification-code-0"
- inputText: "${output.PC0}"
- inputText: "${output.PC1}"
- inputText: "${output.PC2}"
- inputText: "${output.PC3}"
- tapOn:
    id: "verification-verify-button"

# ── 6. Ambos verificados → Avançar → auto-login → DocumentUploadSheet ─────────
- extendedWaitUntil:
    visible: ".*Avançar.*|.*document-sheet-now-button.*"
    timeout: 10000

- runFlow:
    when:
      visible: ".*Avançar.*"
    commands:
      - tapOn: "Avançar"

- extendedWaitUntil:
    visible:
      id: "document-sheet-now-button"
    timeout: 10000

# Provider NÃO tem "Enviar depois" na sheet — assertiva de bloqueio
- assertNotVisible:
    id: "document-sheet-later-button"

# Toca "Enviar agora" (única opção disponível)
- tapOn:
    id: "document-sheet-now-button"

# ── 7. Tela de upload: provider NÃO tem botão de skip ────────────────────────
- extendedWaitUntil:
    visible: "Verificação de Documento"
    timeout: 8000

# Provider NÃO pode pular — assertiva incondicional
- assertNotVisible:
    id: "document-upload-skip-button"

# Aviso obrigatório deve estar visível
- assertVisible:
    id: "document-upload-provider-mandatory"

# ── 8. Realiza o upload via galeria ──────────────────────────────────────────
- runFlow:
    file: ../common/upload-document-from-gallery.yaml
    env:
      DOCUMENT_TYPE_ID: "cpf"

# ── 9. Após upload: navega para home ─────────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*dashboard.*"
    timeout: 15000
