appId: com.andersonfilho.cawme
name: ✅ Register Flow - CNPJ
description: Cadastro completo com documento CNPJ (pessoa jurídica)
tags:
  - register
  - cnpj
  - document-type
  - e2e
---
# Gera CNPJ válido aleatório e telefone único por execução
- evalScript: ${var b=[]; for(var i=0;i<12;i++) b.push(Math.floor(Math.random()*9+1)); var t1=[5,4,3,2,9,8,7,6,5,4,3,2]; var s=0; for(var i=0;i<12;i++) s+=b[i]*t1[i]; var r=s%11; r=r<2?0:11-r; b.push(r); var t2=[6,5,4,3,2,9,8,7,6,5,4,3,2]; s=0; for(var i=0;i<13;i++) s+=b[i]*t2[i]; r=s%11; r=r<2?0:11-r; b.push(r); output.CNPJ=b.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='119'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cnpj"
      FIRST_NAME: "Empresa"
      LAST_NAME: "Teste"
      EMAIL: "cnpj${output.TS}@empresa.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CNPJ}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- extendedWaitUntil:
    visible: ".*Endereço.*|.*Verificação.*|.*CEP.*"
    timeout: 12000

- runFlow:
    file: ../common/skip-to-home.yaml
