appId: com.andersonfilho.cawme
name: ✅ Register Flow - Complete (New Flow)
description: Testa fluxo completo de cadastro com verificação pós-registro
tags:
  - critical
  - register
  - e2e
---
- launchApp:
    clearState: true
- assertVisible: "Cawme"
- assertVisible: ".*Bem-vindo.*"

# Navega para cadastro
- tapOn: "Criar conta"
- assertVisible: "Crie sua conta"

# Seleciona tipo de documento (CPF)
- tapOn: "CPF"

# Preenche formulário
- inputText: "Monkey"
- inputText: "Test"
- inputText: "monkey${RANDOM_NUMBER}@test.com"
- inputText: "11999999999"
- inputText: "12345678909"
- inputText: "password123"
- inputText: "password123"

# Avança para termos
- tapOn: "Avançar"
- assertVisible: "Termos de Uso"

# Aceita termos
- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# Agora vai para verificação (novo fluxo)
- assertVisible: "Verificação"
- assertVisible: "Confirme seu e-mail e telefone"

# Verifica que código foi enviado para email
- assertVisible: "Código enviado para"

# Pular verificação (testa o fluxo alternativo)
- tapOn: "Verificar depois"

# Deve ir para home
- assertVisible: ".*Home.*|.*Dashboard.*|.*Início.*"

# Cleanup: faz logout
- runFlow:
    when:
      visible: ".*menu.*|.*perfil.*|.*profile.*"
    commands:
      - tapOn: ".*menu.*|.*perfil.*|.*profile.*"
      - tapOn: "Sair"
      - assertVisible: "Cawme"
    continueOnFailure: true
