appId: com.andersonfilho.cawme
name: 🐵 Monkey Test - Random Exploration (Updated)
description: Simula usuário aleatório explorando o app incluindo novas telas
tags:
  - monkey
  - stress
  - exploration
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: false
- repeat:
    times: 200
    commands:
      # Taps aleatórios em qualquer lugar
      - tapOn: "random"
      
      # Swipes em direções aleatórias
      - runFlow:
          when:
            visible: ".*"
          file: "random-swipe.yaml"
      
      # Input de texto aleatório em campos
      - inputText: "monkey${output.TS}"
      
      # Tenta navegar para registro se disponível
      - runFlow:
          when:
            visible: "Criar conta|Quero cadastrar"
          file: "navigate-to-register.yaml"
      
      # Tenta interagir com termos se visível
      - runFlow:
          when:
            visible: "Termos de Uso|política de privacidade"
          commands:
            - tapOn: "random"
            - scroll
      
      # Tenta interagir com verificação se visível
      - runFlow:
          when:
            visible: "Verificação|Verificar depois|Reenviar"
          commands:
            - tapOn: "random"
            - inputText: "1"
      
      # Tenta interagir com upload de documento se visível
      - runFlow:
          when:
            visible: "Verificação de Documento|Enviar depois"
          commands:
            - tapOn: "random"
            - scroll
      
      # Tenta interagir com conta bloqueada se visível
      - runFlow:
          when:
            visible: "Bloqueada|Suporte"
          commands:
            - tapOn: "random"
      
      # Tenta fazer logout se em área logada
      - runFlow:
          when:
            visible: "Sair|Logout"
          commands:
            - tapOn: "random"
      
      # Assert que app ainda responde
      - assertVisible: ".*"
      
- takeScreenshot: "monkey-test-final.png"
- assertNoCrash: true
