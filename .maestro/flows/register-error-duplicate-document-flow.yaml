appId: com.andersonfilho.cawme
name: ❌ Register Error - CPF/Documento já cadastrado
description: |
  Testa o fluxo quando o CPF já existe no sistema:
  1. Preenche formulário com CPF existente
  2. Submit → backend rejeita
  3. App volta para o formulário com erro no campo documento
  Nota: use um CPF que já existe no banco de dados de testes
tags:
  - register
  - error
  - duplicate
  - document
  - cpf
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Usa CPF que já existe no sistema
- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Duplicate"
      LAST_NAME: "Document"
      EMAIL: "doc${output.TS}@test.com"
      PHONE: "119${output.TS}"
      DOCUMENT: "00000000000"
      PASSWORD: "Senha@123"

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# App deve mostrar erro no campo documento
- extendedWaitUntil:
    visible: ".*CPF.*já.*|.*documento.*uso.*|.*já cadastrado.*"
    timeout: 8000

- takeScreenshot: "register-duplicate-document-error.png"
