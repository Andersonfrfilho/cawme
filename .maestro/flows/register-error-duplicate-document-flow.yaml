appId: com.andersonfilho.cawme
name: ❌ Register Error - CPF já cadastrado
description: |
  1. Registra User A com CPF único válido
  2. clearState (server mantém User A)
  3. Tenta registrar User B com o mesmo CPF → erro de duplicata
tags:
  - register
  - error
  - duplicate
  - document
  - cpf
  - e2e
---
# ── FASE 1: registrar User A ─────────────────────────────────────────────────
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.DUP_CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='119'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Dup"
      LAST_NAME: "CpfA"
      EMAIL: "cpfA${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.DUP_CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 15000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- extendedWaitUntil:
    visible: ".*Endereço.*|.*Verificação.*|.*CEP.*"
    timeout: 12000

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# ── FASE 2: User B com mesmo CPF ─────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- evalScript: ${output.TS2=Date.now().toString().slice(-8); output.PHONE2='118'+output.TS2;}

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Dup"
      LAST_NAME: "CpfB"
      EMAIL: "cpfB${output.TS2}@test.com"
      PHONE: "${output.PHONE2}"
      DOCUMENT: "${output.DUP_CPF}"
      PASSWORD: "Senha@123"

# onSubmit verifica no servidor; CPF duplicado bloqueia navegação para Termos.
# Erro aparece no formulário de registro. Mensagem do servidor: "Documento já está cadastrado"
- extendedWaitUntil:
    visible: ".*[Dd]ocumento.*cadastrado.*|.*[Cc]PF.*cadastrado.*|.*já cadastrado.*|.*já.*uso.*"
    timeout: 20000
