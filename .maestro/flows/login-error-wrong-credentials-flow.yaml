appId: com.andersonfilho.cawme
name: ❌ Login Error - Credenciais inválidas
description: |
  Testa os erros da tela de login:
  1. Login com senha errada → mensagem de erro
  2. Login com email não cadastrado → mensagem de erro
  3. Login com campos vazios → validação local
  4. Sucesso após corrigir credenciais
tags:
  - login
  - error
  - credentials
  - e2e
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

# Navega para login via link "Entrar" na welcome screen
- tapOn:
    id: "welcome-login-button"

- extendedWaitUntil:
    visible: ".*E-mail.*|.*Entrar.*"
    timeout: 8000

# ── Teste 1: Submit com campos vazios ────────────────────────────────────────
- tapOn: "Entrar"

- extendedWaitUntil:
    visible: ".*obrigatório.*|.*preencha.*|.*campo.*vazio.*|.*e-mail.*"
    timeout: 5000

# ── Teste 2: Email não cadastrado ─────────────────────────────────────────────
- tapOn: "(?i)^(usuário|e-mail)$"
- inputText: "naoexiste@test.com"

- tapOn: "(?i)^senha$"
- inputText: "Senha@123"
- tapOn: "Entrar"

- extendedWaitUntil:
    visible: ".*inválid.*|.*incorret.*|.*não encontrado.*|.*credenciais.*|.*usuário.*"
    timeout: 8000

- takeScreenshot: "login-error-user-not-found.png"

# ── Teste 3: Email correto mas senha errada ───────────────────────────────────
- runFlow:
    when:
      visible: ".*E-mail.*|.*email.*"
    commands:
      - tapOn: "(?i)^(usuário|e-mail)$"
      - clearText:
          optional: true
      - inputText: "existing@test.com"
      - tapOn: "(?i)^senha$"
      - clearText:
          optional: true
      - inputText: "SenhaErrada@999"
      - tapOn: "Entrar"
      - extendedWaitUntil:
          visible: ".*inválid.*|.*incorret.*|.*senha.*|.*credenciais.*"
          timeout: 8000

- takeScreenshot: "login-error-wrong-password.png"

# ── Teste 4: Navega para recuperar senha ──────────────────────────────────────
- runFlow:
    when:
      visible: ".*Esqueci.*senha.*|.*Recuperar.*"
    commands:
      - tapOn: ".*Esqueci.*senha.*|.*Recuperar.*"
      - extendedWaitUntil:
          visible: ".*Recuperar.*|.*Redefinir.*|.*e-mail.*"
          timeout: 5000
      - tapOn: ".*Voltar.*"
        optional: true
