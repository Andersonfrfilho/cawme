appId: com.andersonfilho.cawme
name: ❌ Login Error - Credenciais inválidas
description: |
  Testa tratamento de erros da tela de login:
  1. Submit com campos vazios → validação local
  2. Credenciais incorretas → erro do backend
tags:
  - login
  - error
  - credentials
  - e2e
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-login-button"

- extendedWaitUntil:
    visible: "Bem-vindo de volta"
    timeout: 8000

# ── Teste 1: Submit com campos vazios ────────────────────────────────────────
# Botão não está desabilitado em campos vazios; handleSubmit bloqueia localmente
- tapOn:
    id: "login-submit"

# Após submit vazio, permanecemos na tela de login (sem navegação)
- extendedWaitUntil:
    visible: "Bem-vindo de volta"
    timeout: 5000

# ── Teste 2: E-mail não cadastrado + senha qualquer ───────────────────────────
- runFlow:
    file: ../common/do-login.yaml
    env:
      EMAIL: "naoexiste_jamais@test.com"
      PASSWORD: "SenhaErrada1"

- extendedWaitUntil:
    visible: ".*inválid.*|.*incorret.*|.*não encontrad.*|.*Usuário.*senha.*"
    timeout: 10000

# ── Teste 3: Navega para recuperar senha ──────────────────────────────────────
- runFlow:
    when:
      visible: ".*Esqueci.*|.*Recuperar.*"
    commands:
      - tapOn: ".*Esqueci.*|.*Recuperar.*"
      - extendedWaitUntil:
          visible: ".*Recuperar.*|.*Redefinir.*|.*e-mail.*"
          timeout: 5000
      - tapOn:
          id: "back-button"
          optional: true
