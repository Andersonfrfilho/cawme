appId: com.andersonfilho.cawme
name: ❌ Login Error - Credenciais inválidas
description: |
  Testa os erros da tela de login:
  1. Login com senha errada → mensagem de erro
  2. Login com email não cadastrado → mensagem de erro
  3. Login com campos vazios → validação local
  4. Sucesso após corrigir credenciais
tags:
  - login
  - error
  - credentials
  - e2e
---
- launchApp:
    clearState: true

- assertVisible: "Cawme"

# Navega para login
- tapOn: "Entrar"
- assertVisible:
    text: ".*Login.*|.*Entrar.*|.*E-mail.*"
    timeout: 3000

# ── Teste 1: Submit com campos vazios ────────────────────────────────────────
- tapOn: "Entrar"
- assertVisible:
    text: ".*obrigatório.*|.*preencha.*|.*campo.*vazio.*|.*e-mail.*"
    timeout: 3000

# ── Teste 2: Email não cadastrado ─────────────────────────────────────────────
- inputText: "naoexiste@test.com"
- inputText: "Senha@123"
- tapOn: "Entrar"

- assertVisible:
    text: ".*inválid.*|.*incorret.*|.*não encontrado.*|.*credenciais.*|.*usuário.*"
    timeout: 6000

- takeScreenshot: "login-error-user-not-found.png"

# ── Teste 3: Email correto mas senha errada ───────────────────────────────────
# Limpa campos (volta com erro)
- runFlow:
    when:
      visible: ".*Login.*|.*E-mail.*"
    commands:
      - clearText:
          optional: true
      - inputText: "existing@test.com"
      - clearText:
          optional: true
      - inputText: "SenhaErrada@999"
      - tapOn: "Entrar"
      - assertVisible:
          text: ".*inválid.*|.*incorret.*|.*senha.*|.*credenciais.*"
          timeout: 6000
    continueOnFailure: true

- takeScreenshot: "login-error-wrong-password.png"

# ── Teste 4: Navega para recuperar senha ──────────────────────────────────────
- runFlow:
    when:
      visible: ".*Esqueci.*senha.*|.*Recuperar.*"
    commands:
      - tapOn: ".*Esqueci.*senha.*|.*Recuperar.*"
      - assertVisible:
          text: ".*Recuperar.*|.*Redefinir.*|.*e-mail.*"
          timeout: 4000
      - tapOn: ".*Voltar.*"
        optional: true
    continueOnFailure: true
