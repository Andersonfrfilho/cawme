appId: com.andersonfilho.cawme
name: ⚡ Provider Profile Setup - Fast Flow (Seeded User)
description: |
  Fast provider profile setup using pre-seeded test user.
  Requires database seeder to have been run first (QA test providers).

  Logs in with: provider-test-1@test.com / Test@12345
  Tests provider profile setup:
  - 2 service categories
  - 2 services with pricing
  - 3 days availability
  - Review and submit

tags:
  - provider
  - profile
  - fast
  - seeded
  - e2e
---
# Start fresh
- launchApp:
    clearState: true

# Wait for app to load
- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

# Logout if needed (cleanup from previous tests)
- runFlow:
    file: ../common/logout-if-needed.yaml

# ── Welcome Screen: Select Contractor Path ──────────────────────────────
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-offer-button"

# ── Login Screen ────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Você já tem uma conta?"
    timeout: 8000

# Tap on login link
- tapOn:
    id: "register-login-link"

# ── Login Form ──────────────────────────────────────────────────────────
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 8000

# Enter email
- tapOn:
    id: "login-email-input"
- inputText: "provider-test-1@test.com"

# Enter password
- tapOn:
    id: "login-password-input"
- inputText: "Test@12345"

# Submit
- tapOn:
    id: "login-submit-button"

# ── Wait for Home/Dashboard (already verified) ───────────────────────────
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 15000

# ── Navigate to Provider Profile Setup ───────────────────────────────────
# This depends on app navigation - may need to open a menu or use a button
# For now, we'll assume the provider can access profile setup from home
- tapOn:
    id: "profile-setup-button"
    optional: true  # May not exist if setup already complete

# ── Provider Profile Setup: Categories ──────────────────────────────────
- extendedWaitUntil:
    visible: "Quais serviços você oferece?"
    timeout: 15000

# Select 2 categories
- tapOn:
    id: "category-card"
    index: 0

- tapOn:
    id: "category-card"
    index: 1

# Verify checkmarks appear
- assertVisible: "checkmark-circle"

# Proceed to services
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Services ────────────────────────────────────
- extendedWaitUntil:
    visible: "Seus serviços"
    timeout: 8000

# Add first service
- tapOn:
    id: "add-service-button"

- extendedWaitUntil:
    visible: "Adicionar novo serviço"
    timeout: 5000

- tapOn:
    id: "service-name-input"
- inputText: "Limpeza Completa"

- tapOn:
    id: "duration-input"
- eraseText: 10
- inputText: "120"

- tapOn:
    id: "price-input"
- inputText: "150.00"

- tapOn:
    id: "service-modal-submit-button"

# Verify service appears
- assertVisible: "Limpeza Completa"

# Add second service
- tapOn:
    id: "add-service-button"

- extendedWaitUntil:
    visible: "Adicionar novo serviço"
    timeout: 5000

- tapOn:
    id: "service-name-input"
- inputText: "Limpeza Rápida"

- tapOn:
    id: "duration-input"
- eraseText: 10
- inputText: "60"

- tapOn:
    id: "price-input"
- inputText: "75.00"

- tapOn:
    id: "service-modal-submit-button"

# Verify second service
- assertVisible: "Limpeza Rápida"

# Proceed to availability
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Availability ────────────────────────────────
- extendedWaitUntil:
    visible: "Sua disponibilidade"
    timeout: 8000

# Enable Monday (index 1)
- tapOn:
    id: "day-toggle-1"

- tapOn:
    id: "day-1-start-time"
- inputText: "09:00"

- tapOn:
    id: "day-1-end-time"
- inputText: "18:00"

# Enable Tuesday (index 2)
- tapOn:
    id: "day-toggle-2"

- tapOn:
    id: "day-2-start-time"
- inputText: "09:00"

- tapOn:
    id: "day-2-end-time"
- inputText: "18:00"

# Enable Friday (index 5)
- tapOn:
    id: "day-toggle-5"

- tapOn:
    id: "day-5-start-time"
- inputText: "10:00"

- tapOn:
    id: "day-5-end-time"
- inputText: "17:00"

# Proceed to review
- tapOn:
    id: "action-bar-next-button"

# ── Provider Profile Setup: Review ──────────────────────────────────────
- extendedWaitUntil:
    visible: "Confirmação do perfil"
    timeout: 8000

# Verify all sections are visible
- assertVisible: "Categorias"
- assertVisible: "Serviços"
- assertVisible: "Disponibilidade"

# Verify services appear
- assertVisible: "Limpeza Completa"
- assertVisible: "Limpeza Rápida"

# Verify days appear
- assertVisible: "Segunda"
- assertVisible: "Terça"
- assertVisible: "Sexta"

# Submit profile
- tapOn:
    id: "action-bar-submit-button"

# ── Verify Completion ───────────────────────────────────────────────────
# Should redirect to home/dashboard
- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 15000

# Final verification that we're on home screen
- assertVisible: ".*Início.*|.*Home.*|.*Dashboard.*"
