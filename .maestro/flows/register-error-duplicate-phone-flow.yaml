appId: com.andersonfilho.cawme
name: ❌ Register Error - Telefone já cadastrado
description: |
  Testa o fluxo quando o telefone já existe no sistema:
  1. Preenche formulário com telefone existente
  2. Submit → backend rejeita
  3. App volta para o formulário com erro no campo telefone
  Nota: use um telefone que já existe no banco de dados de testes
tags:
  - register
  - error
  - duplicate
  - phone
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Usa telefone que já existe no sistema (seed de testes)
- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Duplicate"
      LAST_NAME: "Phone"
      EMAIL: "phone${output.TS}@test.com"
      PHONE: "11900000001"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# App deve voltar para o formulário com erro no campo telefone
- extendedWaitUntil:
    visible: ".*telefone.*já.*|.*celular.*uso.*|.*já cadastrado.*"
    timeout: 8000

- takeScreenshot: "register-duplicate-phone-error.png"
