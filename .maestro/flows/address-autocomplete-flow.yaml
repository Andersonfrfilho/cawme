appId: com.andersonfilho.cawme
name: ✅ Address Flow - Autocomplete por nome de rua
description: |
  Testa o caminho de endereço via busca por texto (autocomplete):
  1. Cadastra usuário único
  2. Toca em "Não sei meu CEP"
  3. Digita nome de rua na busca
  4. Seleciona sugestão
  5. Confirma endereço com número
  6. Pula verificação → home
tags:
  - address
  - autocomplete
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='112'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Auto"
      LAST_NAME: "Complete"
      EMAIL: "autocomplete${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Aguarda chegar na tela de endereço (CEP step)
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

# Toca em "Não sei meu CEP" para abrir o autocomplete
- tapOn:
    text: ".*sei meu CEP.*"

- extendedWaitUntil:
    visible: ".*Buscar.*|.*Digite.*|.*rua.*|.*logradouro.*"
    timeout: 5000

# Digita na busca
- inputText: "Avenida Paulista"

# Aguarda sugestões aparecerem
- extendedWaitUntil:
    visible: ".*Consolação.*|.*Paulista.*|.*São Paulo.*"
    timeout: 8000

# keyboardShouldPersistTaps="handled" permite tap na sugestão com teclado aberto.
# Usa texto da cidade (único na lista de sugestões, não aparece no input).
- tapOn:
    text: ".*Consolação.*"

# Deve ir para confirmação de endereço (confirm step)
- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 5000

# Preenche número
- tapOn:
    id: "address-number-input"
- inputText: "1578"
- pressKey: Enter
- pressKey: Enter

# Avança → verificação → home
- runFlow:
    file: ../common/skip-to-home.yaml
