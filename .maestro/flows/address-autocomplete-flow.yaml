appId: com.andersonfilho.cawme
name: ✅ Address Flow - Autocomplete por nome de rua
description: |
  Testa o caminho de endereço via busca por texto (autocomplete):
  1. Toca em "Não sei meu CEP"
  2. Digita nome de rua na busca
  3. Seleciona sugestão
  4. Confirma endereço com número
tags:
  - address
  - autocomplete
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# Cadastro rápido para chegar na tela de endereço
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Auto"
      LAST_NAME: "Complete"
      EMAIL: "autocomplete${output.TS}@test.com"
      PHONE: "11955554444"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# Tela de endereço - step CEP
- extendedWaitUntil:
    visible: ".*CEP.*|.*Endereço.*"
    timeout: 10000

# Toca em "Não sei meu CEP" para abrir o autocomplete
- tapOn:
    text: ".*Não sei.*|.*Não conheço.*|.*Buscar por nome.*"

- extendedWaitUntil:
    visible: ".*Buscar.*|.*Digite.*|.*rua.*|.*logradouro.*"
    timeout: 5000

# Digita na busca
- inputText: "Avenida Paulista"

# Aguarda sugestões aparecerem
- extendedWaitUntil:
    visible: ".*Paulista.*|.*São Paulo.*"
    timeout: 8000

# Seleciona a primeira sugestão
- tapOn:
    text: ".*Paulista.*"
    index: 0

# Deve voltar para confirmação de endereço
- extendedWaitUntil:
    visible: ".*Número.*|.*Complemento.*|.*Confirmar.*"
    timeout: 5000

# Preenche número
- tapOn:
    text: ".*Número.*"
    optional: true
- inputText: "1578"

- tapOn:
    id: "register-submit"

- runFlow:
    file: ../common/skip-to-home.yaml
