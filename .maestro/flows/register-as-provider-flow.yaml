appId: com.andersonfilho.cawme
name: ✅ Register Flow - Prestador de Serviço
description: Cadastro pelo caminho "Quero cadastrar meu serviço" (provider)
tags:
  - register
  - provider
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='117'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# Caminho de provider (diferente de contractor)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-offer-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Prestador"
      LAST_NAME: "Teste"
      EMAIL: "provider${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

- extendedWaitUntil:
    visible: ".*Endereço.*|.*Verificação.*|.*CEP.*"
    timeout: 12000

- runFlow:
    file: ../common/skip-to-home.yaml
