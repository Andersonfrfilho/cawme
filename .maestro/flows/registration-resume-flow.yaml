appId: com.andersonfilho.cawme
name: 🔄 Registration Resume Flow
description: |
  Testa o checkpoint de cadastro:
  1. Inicia o registro até a tela de endereço
  2. Fecha o app (simula abandono no meio do fluxo)
  3. Reabre sem limpar estado
  4. Verifica que o app executa o auto-resume (tentativa de login)
  5. Como Keycloak exige verificação de email em E2E, o login falha silenciosamente
  6. App retorna para a welcome screen sem crash
  Nota: a navegação automática para /address só funciona com servidor em QA mode
  (sem exigência de verificação de email para login por senha).
tags:
  - critical
  - register
  - resume
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='116'+output.TS;}

# ── PARTE 1: Cadastro até a tela de endereço ─────────────────────────────────
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# Vai para cadastro
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Preenche dados pessoais com CPF
- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Anderson"
      LAST_NAME: "Teste"
      EMAIL: "resumetest${output.TS}@cawme.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

# fill-register-form já submete via pressKey: Enter no confirmPassword
- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

# Aceita termos e cria conta
- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# O app vai para a tela de endereço (pendingRegistration gravado no MMKV)
- extendedWaitUntil:
    visible: ".*Endereço.*|.*Onde você mora.*|.*CEP.*"
    timeout: 12000

# ── PARTE 2: Fecha o app sem completar o endereço ────────────────────────────
- stopApp

# ── PARTE 3: Reabre e verifica comportamento pós-resume ──────────────────────
# Abre sem limpar estado — pendingRegistration e tempCredentials permanecem no MMKV
- launchApp:
    clearState: false

# O auto-resume tenta login (showLoading → KeycloakService.login → falha silenciosa)
# O app retorna para a welcome screen sem crash após o timeout do login
- extendedWaitUntil:
    visible: ".*Cawme.*|.*Encontre profissionais.*|.*Endereço.*|.*Onde você mora.*"
    timeout: 45000

# Se o servidor estiver em QA mode (sem verificação obrigatória), vai para endereço:
- runFlow:
    when:
      visible: ".*Endereço.*|.*Onde você mora.*|.*CEP.*"
    commands:
      - assertNotVisible: "Encontre profissionais"
      - assertNotVisible: "Bem-vindo de volta"
      # Completa o fluxo a partir do endereço para chegar na home
      - runFlow:
          file: ../common/skip-to-home.yaml
      # ── Badge de ativação pendente ──
      # QA mode: auto-login OK → isSignedIn=true → badge aparece com email+telefone+documento pendentes
      - extendedWaitUntil:
          visible: ".*Início.*|.*Home.*|.*Dashboard.*"
          timeout: 8000
      - runFlow:
          when:
            visible: "Verificação Pendente"
          commands:
            - assertVisible:
                id: "pending-verification-banner"
            - assertVisible: "Verificação Pendente"
      - runFlow:
          when:
            notVisible: "Verificação Pendente"
          commands:
            - assertNotVisible:
                id: "pending-verification-banner"

# Se o login falhou (ambiente padrão), volta para welcome screen sem crash:
- runFlow:
    when:
      visible: "Encontre profissionais"
    commands:
      - assertVisible: "Encontre profissionais"
      # Badge NÃO aparece: isSignedIn=false após falha do auto-resume
      - assertNotVisible: "Verificação Pendente"

# Garantia incondicional: badge nunca aparece enquanto isSignedIn=false
# (cobre o caso onde o app ainda está em transição quando os condicionais rodam)
- assertNotVisible: "Verificação Pendente"
- assertNotVisible:
    id: "pending-verification-banner"
