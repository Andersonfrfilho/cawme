appId: com.andersonfilho.cawme
name: 🔄 Registration Resume Flow
description: |
  Testa o checkpoint de cadastro:
  1. Inicia o registro até a tela de endereço
  2. Fecha o app (simula abandono no meio do fluxo)
  3. Reabre sem limpar estado
  4. Verifica que o app detecta o cadastro pendente e redireciona automaticamente
tags:
  - critical
  - register
  - resume
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}


# ── PARTE 1: Cadastro até a tela de endereço ─────────────────────────────────
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

# Vai para cadastro
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Preenche dados pessoais com CPF
- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Anderson"
      LAST_NAME: "Teste"
      EMAIL: "resumetest${output.TS}@cawme.com"
      PHONE: "11988880000"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

# fill-register-form já submete via pressKey: Enter no confirmPassword
- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

# Aceita termos e cria conta
- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# O app vai para a tela de endereço (sem endereço no momento do registro)
- extendedWaitUntil:
    visible: ".*Endereço.*|.*Onde você mora.*|.*CEP.*"
    timeout: 12000

# ── PARTE 2: Fecha o app sem completar o endereço ────────────────────────────
- stopApp

# ── PARTE 3: Reabre e verifica o auto-resume ─────────────────────────────────
# Abre sem limpar estado — pendingRegistration permanece no MMKV
- launchApp:
    clearState: false

# O app deve logar automaticamente e redirecionar para o endereço
- extendedWaitUntil:
    visible: ".*Endereço.*|.*Onde você mora.*|.*CEP.*"
    timeout: 15000

# Confirma que não voltou para a home ou welcome screen
- assertNotVisible: "Quero contratar"
- assertNotVisible: "Entrar"
