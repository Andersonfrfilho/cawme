appId: com.andersonfilho.cawme
name: 🔓 Contractor - Verificação Opcional (Regressão)
description: |
  Regressão: garante que contractors AINDA PODEM pular verificação após
  as mudanças que tornaram a verificação obrigatória para providers.
  1. Cadastra usuário como contractor (welcome-hire-button)
  2. Preenche endereço
  3. Na tela de verificação:
     - Botão "Verificar depois" DEVE existir
     - Aviso obrigatório (id: verification-provider-mandatory) NÃO deve aparecer
     - Tap no skip → chega na home
  Objetivo: garantir que a mudança de provider não quebrou o fluxo de contractor.
tags:
  - contractor
  - verification
  - regression
  - e2e
---
- evalScript: ${var d=[]; for(var i=0;i<9;i++) d.push(Math.floor(Math.random()*10)); var s=0; for(var i=0;i<9;i++) s+=d[i]*(10-i); var r=(s*10)%11; if(r>=10)r=0; d.push(r); s=0; for(var i=0;i<10;i++) s+=d[i]*(11-i); r=(s*10)%11; if(r>=10)r=0; d.push(r); output.CPF=d.join(''); output.TS=Date.now().toString().slice(-8); output.PHONE='123'+output.TS;}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

# Contractor usa "Quero contratar" (welcome-hire-button)
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Contractor"
      LAST_NAME: "Optional"
      EMAIL: "contractor${output.TS}@test.com"
      PHONE: "${output.PHONE}"
      DOCUMENT: "${output.CPF}"
      PASSWORD: "Senha@123"

- extendedWaitUntil:
    visible: "Termos de Uso"
    timeout: 8000

- tapOn:
    id: "terms-accept-checkbox"
- tapOn:
    id: "terms-submit-button"

# Preenche endereço
- extendedWaitUntil:
    visible: "Onde você mora?"
    timeout: 12000

- tapOn:
    id: "address-cep-input"
- eraseText: 10
- inputText: "01310100"

- extendedWaitUntil:
    visible: "Endereço encontrado"
    timeout: 15000

- tapOn:
    id: "address-number-input"
- inputText: "100"
- pressKey: Enter
- pressKey: Enter

# ── Verificação OPCIONAL para contractor ─────────────────────────────────────
- extendedWaitUntil:
    visible: ".*Verificação.*|.*Confirme seu e-mail.*"
    timeout: 12000

# 1. Botão skip DEVE existir para contractor
- assertVisible:
    id: "verification-skip-button"

# 2. Aviso obrigatório NÃO deve aparecer para contractor
- assertNotVisible:
    id: "verification-provider-mandatory"

# 3. Abas de e-mail e telefone estão presentes
- assertVisible:
    id: "verification-tab-email"
- assertVisible:
    id: "verification-tab-phone"

# 4. Toca skip → auto-login → chega na home com badge pendente
- tapOn:
    id: "verification-skip-button"

- extendedWaitUntil:
    visible: ".*Início.*|.*Home.*|.*Dashboard.*"
    timeout: 15000

# 5. Banner de onboarding pendente DEVE aparecer:
# handleSkipVerification salva pendingOnboarding no store → home renderiza sem precisar de login
- extendedWaitUntil:
    visible:
      id: "pending-onboarding-banner"
    timeout: 8000
