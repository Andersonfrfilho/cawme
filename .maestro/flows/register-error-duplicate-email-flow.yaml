appId: com.andersonfilho.cawme
name: ❌ Register Error - Email já cadastrado
description: |
  Testa o fluxo quando o email já existe no sistema:
  1. Preenche formulário com email existente
  2. Submit → backend rejeita com 409
  3. App volta para o formulário com erro no campo email
  4. Mostra botão "Esqueci minha senha"
  5. Usuário pode corrigir o email e tentar novamente
  Nota: use um email que já existe no banco de dados de testes
tags:
  - register
  - error
  - duplicate
  - email
  - e2e
---
- evalScript: ${output.TS = Date.now().toString().slice(-8)}

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000
- tapOn:
    id: "welcome-hire-button"

- extendedWaitUntil:
    visible: "Crie sua conta"
    timeout: 8000

# Usa email que já existe no sistema (seed de testes)
- runFlow:
    file: ../common/fill-register-form.yaml
    env:
      DOCUMENT_TYPE: "cpf"
      FIRST_NAME: "Duplicate"
      LAST_NAME: "Email"
      EMAIL: "existing@test.com"
      PHONE: "11933332222"
      DOCUMENT: "12345678909"
      PASSWORD: "Senha@123"

- tapOn: "Eu li e concordo"
- tapOn: "Finalizar cadastro"

# App deve voltar para o formulário com erro no campo email
- extendedWaitUntil:
    visible: ".*já cadastrado.*|.*já existe.*|.*e-mail.*uso.*|.*email.*uso.*"
    timeout: 8000

# Botão "Esqueci minha senha" deve aparecer (pois email já existe)
- extendedWaitUntil:
    visible: ".*Esqueci.*senha.*|.*Recuperar.*|.*Senha.*"
    timeout: 5000

# Tira screenshot do estado de erro
- takeScreenshot: "register-duplicate-email-error.png"

# Testa o botão de recuperar senha (apenas verifica que navega)
- runFlow:
    when:
      visible: ".*Esqueci.*senha.*|.*Recuperar.*senha.*"
    commands:
      - tapOn: ".*Esqueci.*senha.*|.*Recuperar.*senha.*"
      - extendedWaitUntil:
          visible: ".*Recuperar.*|.*E-mail.*|.*redefinir.*|.*nova senha.*"
          timeout: 5000
      - tapOn: ".*Voltar.*|.*chevron.*"
        optional: true

# Testa correção do email e nova tentativa
- runFlow:
    when:
      visible: "Crie sua conta"
    commands:
      - clearText:
          optional: true
      - inputText: "newemail${output.TS}@test.com"
      - tapOn:
    id: "register-submit"
