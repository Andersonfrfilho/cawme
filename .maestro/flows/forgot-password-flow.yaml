appId: com.cawme.app
tags: [auth, password, recovery, e2e]

description: Happy path for forgot password flow

commands:
  # 1. Navigate to login screen / Welcome screen
  - tapOn:
      id: login.screen
  - delay: 500ms

  # 2. Tap "Esqueci minha senha"
  - tapOn:
      text: Esqueci minha senha

  # 3. Verify ForgotPasswordScreen is visible
  - assertVisible:
      id: forgot-password-email-input
  - delay: 500ms

  # 4. Fill email input with test QA email
  - inputText:
      id: forgot-password-email-input
      text: qa-test@cawme.com
  - delay: 300ms

  # 5. Tap submit button
  - tapOn:
      id: forgot-password-submit-button
  - delay: 1500ms

  # 6. Wait for success message to appear
  - extendedWaitUntil:
      timeout: 10000
      condition:
        - assertVisible:
            id: forgot-password-success-message

  # 7. Verify back button is visible
  - assertVisible:
      id: forgot-password-back-button

  # 8. Tap back to login button
  - tapOn:
      id: forgot-password-back-button
  - delay: 500ms

  # 9. Verify we're back at login screen (by checking for login title or welcome text)
  - extendedWaitUntil:
      timeout: 5000
      condition:
        - assertVisible:
            text: Bem-vindo de volta
