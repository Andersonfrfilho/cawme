appId: com.andersonfilho.cawme
name: 🔐 Login Flow - With Verification Check
description: Testa fluxo de login com checagem de verificação pendente
tags:
  - critical
  - login
  - e2e
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml


# Aguarda welcome screen (após logout ou se já estava lá)
- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

# Navega para login via link "Entrar" na welcome screen
- tapOn:
    id: "welcome-login-button"

- extendedWaitUntil:
    visible: ".*E-mail.*|.*Entrar.*"
    timeout: 8000

# Preenche credenciais com conta existente de testes
- tapOn: "(?i)^(usuário|e-mail)$"
- inputText: "test@example.com"

- tapOn: "(?i)^senha$"
- inputText: "password123"

- tapOn: "Entrar"

- extendedWaitUntil:
    visible: ".*Início.*|.*Verificação.*|.*inválid.*|.*incorret.*"
    timeout: 10000

# Se for redirecionado para verificação (conta pendente)
- runFlow:
    when:
      visible: "Verificação"
    commands:
      - assertVisible: "Verificar depois"
      - tapOn: "Verificar depois"
      - extendedWaitUntil:
          visible: ".*Início.*"
          timeout: 5000
