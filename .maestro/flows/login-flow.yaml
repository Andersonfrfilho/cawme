appId: com.andersonfilho.cawme
name: 🔐 Login Flow - With Verification Check
description: Testa fluxo de login com checagem de verificação pendente
tags:
  - critical
  - login
  - e2e
---
- launchApp:
    clearState: false
- assertVisible: "Cawme"

# Navega para login
- tapOn: "Entrar"
- assertVisible: ".*Login.*|.*Entrar.*"

# Preenche credenciais
- inputText: "test@example.com"
- inputText: "password123"

# Submete
- tapOn: "Entrar"

# Verifica se redirecionou para home ou verificação
- assertVisible: ".*Home.*|.*Dashboard.*|.*Início.*|.*Verificação.*"

# Se for redirecionado para verificação (conta pendente)
- runFlow:
    when:
      visible: "Verificação"
    commands:
      - assertVisible: "Confirme seu e-mail e telefone"
      - assertVisible: "Verificar depois"
      - tapOn: "Verificar depois"
      - assertVisible: ".*Home.*|.*Dashboard.*|.*Início.*"
    continueOnFailure: true
