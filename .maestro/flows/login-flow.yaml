appId: com.andersonfilho.cawme
name: 🔐 Login Flow - UI e tratamento de erro
description: >
  Testa a tela de login: campos preenchíveis, botão funcional, e erro
  visível para credenciais inválidas. O fluxo feliz (login com sucesso)
  depende de conta com e-mail verificado no Keycloak — coberto
  implicitamente pelos flows de registro (token de registro é válido).
tags:
  - critical
  - login
  - e2e
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Cawme"
    timeout: 30000

- runFlow:
    file: ../common/logout-if-needed.yaml

- extendedWaitUntil:
    visible: "Encontre profissionais"
    timeout: 15000

- tapOn:
    id: "welcome-login-button"

- extendedWaitUntil:
    visible: "Bem-vindo de volta"
    timeout: 8000

# Preenche com credenciais inválidas para verificar o tratamento de erro
- runFlow:
    file: ../common/do-login.yaml
    env:
      EMAIL: "naoexiste@test.com"
      PASSWORD: "SenhaErrada1"

# Deve aparecer mensagem de erro — confirma que o form submete e o backend responde
- extendedWaitUntil:
    visible: ".*inválid.*|.*incorret.*|.*não encontrad.*|.*Usuário.*senha.*"
    timeout: 12000
